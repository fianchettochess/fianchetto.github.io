name: Deploy site (with aggregated package docs)

# Builds fianchettochess.app and aggregates the four constituent packages'
# MkDocs docs into /docs/<package>/, then deploys to GitHub Pages.
#
# One-time setup (see README-CI.md at the repo root):
#   1. Repo secret DOCS_PACKAGES_TOKEN — a fine-grained PAT with
#      "Contents: Read-only" on jaredbrewer/{ChessCore,BoardKit,SwiftStockfish,SwiftReckless}.
#      (Not needed once those repos are public — drop the `token:` lines then.)
#   2. Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow"
  repository_dispatch:      # a package repo can POST type "docs-updated" to rebuild
    types: [docs-updated]
  schedule:
    - cron: "0 6 * * *"     # daily — picks up package-docs changes without cross-repo wiring

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout ChessCore
        uses: actions/checkout@v4
        with:
          repository: jaredbrewer/ChessCore
          path: _packages/ChessCore
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout BoardKit
        uses: actions/checkout@v4
        with:
          repository: jaredbrewer/BoardKit
          path: _packages/BoardKit
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftStockfish
        uses: actions/checkout@v4
        with:
          repository: jaredbrewer/SwiftStockfish
          path: _packages/SwiftStockfish
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftReckless
        uses: actions/checkout@v4
        with:
          repository: jaredbrewer/SwiftReckless
          path: _packages/SwiftReckless
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build aggregated package docs
        run: SIBLINGS="$GITHUB_WORKSPACE/_packages" MKDOCS="$(command -v mkdocs)" ./build-docs.sh

      - name: Assemble deployable site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_packages' \
            --exclude '_site' \
            --exclude 'build-docs.sh' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
