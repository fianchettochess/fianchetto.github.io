name: Rebuild package docs (commit-back)

# fianchetto.github.io is a PRIVATE repo, so Pages-from-Actions deploy isn't
# available on this plan. Instead the site is served by Pages "Deploy from a
# branch", and this workflow keeps the committed docs/ up to date: it rebuilds
# the four packages' MkDocs sites and commits the result back. Branch-serving
# then publishes it. See README-CI.md.
#
# Trigger it after a package's docs change: click "Run workflow", or have the
# package repo POST a repository_dispatch of type "docs-updated". A daily run
# is a catch-all. (Not on push here — a source-only push doesn't change the
# package docs, and the commit-back would be a no-op.)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: write            # to commit the rebuilt docs/ back to this repo

concurrency:
  group: docs-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout ChessCore
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/ChessCore
          path: _packages/ChessCore
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout BoardKit
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/BoardKit
          path: _packages/BoardKit
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftStockfish
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftStockfish
          path: _packages/SwiftStockfish
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftReckless
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftReckless
          path: _packages/SwiftReckless
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Rebuild aggregated docs
        run: SIBLINGS="$GITHUB_WORKSPACE/_packages" MKDOCS="$(command -v mkdocs)" ./build-docs.sh

      - name: Commit the rebuilt docs (only if changed)
        run: |
          git config user.name  "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs changes — nothing to commit."
          else
            git commit -m "docs: rebuild package docs [automated]"
            git push
          fi
