name: Rebuild package docs (commit-back)

# fianchetto.github.io is a PRIVATE repo, so Pages-from-Actions deploy isn't
# available on this plan. Instead the site is served by Pages "Deploy from a
# branch", and this workflow keeps the committed docs/ up to date: it rebuilds
# the four packages' MkDocs sites and commits the result back. Branch-serving
# then publishes it. See README-CI.md.
#
# Trigger it after a package's docs change: click "Run workflow", or have the
# package repo POST a repository_dispatch of type "docs-updated". A daily run
# is a catch-all. (Not on push here — a source-only push doesn't change the
# package docs, and the commit-back would be a no-op.)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: write            # to commit the rebuilt docs/ back to this repo

concurrency:
  group: docs-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout ChessCore
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/ChessCore
          path: _packages/ChessCore
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout BoardKit
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/BoardKit
          path: _packages/BoardKit
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftStockfish
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftStockfish
          path: _packages/SwiftStockfish
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftReckless
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftReckless
          path: _packages/SwiftReckless
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      # FianchettoKit has no repo of its own — it is a package inside the app
      # repo, so this checks out fianchetto (default branch) and build-docs.sh
      # reaches into FianchettoKit/docs-site.
      #
      # DOCS_PACKAGES_TOKEN is scoped to all repositories in the org, so this
      # is expected to succeed.  (The app repo's CI_RUNBOOK §4d still describes
      # the older "Only select repositories" over four packages — that text is
      # stale; the live token is broader.)
      #
      # continue-on-error is still deliberate, but it does NOT mean a failure
      # is tolerated: the "Require FianchettoKit" step below fails the job if
      # this did not succeed.  It buys ordering, not forgiveness — the four
      # other packages still build and commit first, so a broken fianchetto
      # checkout costs a red job and a stale FianchettoKit rather than a whole
      # day's rebuild for every package.
      - name: Checkout Fianchetto (for FianchettoKit docs)
        id: checkout_fianchetto
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/fianchetto
          path: _packages/Fianchetto
          token: ${{ secrets.DOCS_PACKAGES_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Rebuild aggregated docs
        id: build
        run: SIBLINGS="$GITHUB_WORKSPACE/_packages" MKDOCS="$(command -v mkdocs)" ./build-docs.sh

      - name: Report what was aggregated
        if: always()
        run: |
          {
            echo "### Aggregated doc sets"
            echo
            for d in docs/*/; do
              name="$(basename "$d")"
              [[ -f "$d/index.html" ]] && echo "- ✅ \`$name\`"
            done
            case "${{ steps.checkout_fianchetto.outcome }}" in
              success) ;;
              skipped)
                echo
                echo "> ⚠️ **FianchettoKit was skipped** — its checkout never"
                echo "> ran, because an earlier required checkout failed."
                echo "> Check that step's log; this is *not* a token problem."
                ;;
              *)
                echo
                echo "> ❌ **FianchettoKit was skipped** — checking out"
                echo "> \`fianchettochess/fianchetto\` failed"
                echo "> (outcome: \`${{ steps.checkout_fianchetto.outcome }}\`)."
                echo "> \`DOCS_PACKAGES_TOKEN\` is supposed to cover all org"
                echo "> repositories — check whether it expired or was"
                echo "> re-scoped. The other packages still published."
                ;;
            esac
            if [[ "${{ steps.build.outcome }}" != "success" ]]; then
              echo
              echo "> ❌ **A package failed to build.** Any package that did"
              echo "> build was still committed; the one that failed kept its"
              echo "> previous output. See the build step's log for which."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # always(): build-docs.sh exits non-zero if any package failed, but it
      # still swapped in every package that DID build.  Committing those keeps
      # one bad package from discarding the others' rebuild; the job still goes
      # red because the build step itself failed.
      - name: Commit the rebuilt docs (only if changed)
        if: always()
        run: |
          git config user.name  "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs changes — nothing to commit."
          else
            git commit -m "docs: rebuild package docs [automated]"
            git push
          fi

      # The checkout is continue-on-error so the other packages still publish,
      # but a missing FianchettoKit is a real failure, not an accepted state.
      # Fail the job here — after the commit above has salvaged what did build.
      - name: Require FianchettoKit
        if: always() && steps.checkout_fianchetto.outcome != 'success'
        run: |
          echo "::error::FianchettoKit was not aggregated — checking out" \
               "fianchettochess/fianchetto had outcome" \
               "'${{ steps.checkout_fianchetto.outcome }}'." \
               "DOCS_PACKAGES_TOKEN should cover all org repositories;" \
               "check whether it expired or was re-scoped."
          exit 1
