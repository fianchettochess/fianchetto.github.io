name: Rebuild package docs (commit-back)

# The site is served by Pages "Deploy from a branch", and this workflow keeps the
# committed docs/ up to date: it rebuilds the four packages' MkDocs sites and
# commits the result back. Branch-serving then publishes it. See README-CI.md.
#
# WHY COMMIT-BACK, AND WHY IT NO LONGER HAS TO BE. This repository was PRIVATE,
# and Pages-from-Actions deploy is unavailable to a private repo on this plan —
# so committing the built site was the only way to publish it. It went public on
# 2026-09-07, which makes `actions/deploy-pages` available and this whole
# arrangement optional. Switching means changing the Pages source in repository
# settings AND replacing the commit-back below with a deploy step, so it is a
# deliberate change rather than a comment edit; until someone makes it, the
# commit-back is still what publishes the site. It also costs 17 MB of built
# output in git. (repo made public 2026-09-07)
#
# Trigger it after a package's docs change: click "Run workflow", or have the
# package repo POST a repository_dispatch of type "docs-updated". A daily run
# is a catch-all. (Not on push here — a source-only push doesn't change the
# package docs, and the commit-back would be a no-op.)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: read             # the built site is uploaded, never committed back
  pages: write               # to deploy to GitHub Pages
  id-token: write            # OIDC, required by actions/deploy-pages

concurrency:
  group: docs-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout ChessCore
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/ChessCore
          path: _packages/ChessCore
      - name: Checkout BoardKit
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/BoardKit
          path: _packages/BoardKit
      # FianchettoKit is SUPPRESSED as of 2026-09-07 — it is the one package
      # here whose repository is still private, so its docs described something
      # a reader could not obtain. Restore by uncommenting this step AND its
      # line in build-docs.sh; the two must move together, because a package
      # listed there but not checked out here fails the build deliberately.
      # It was also the last consumer of DOCS_PACKAGES_TOKEN. Every other
      # package is public now — SwiftReckless as of 2026-09-07 — so the live
      # checkouts below pass no token at all, and the secret has no remaining
      # user in this workflow. Restoring FianchettoKit means restoring its
      # token line too, since that repository is the private one.
      # - name: Checkout FianchettoKit
      #   uses: actions/checkout@v4
      #   with:
      #     repository: fianchettochess/FianchettoKit
      #     path: _packages/FianchettoKit
      #     token: ${{ secrets.DOCS_PACKAGES_TOKEN }}
      - name: Checkout SwiftStockfish
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftStockfish
          path: _packages/SwiftStockfish
      - name: Checkout SwiftReckless
        uses: actions/checkout@v4
        with:
          repository: fianchettochess/SwiftReckless
          path: _packages/SwiftReckless

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Rebuild aggregated docs
        run: SIBLINGS="$GITHUB_WORKSPACE/_packages" MKDOCS="$(command -v mkdocs)" ./build-docs.sh

      # DEPLOYED, NOT COMMITTED. Built output used to be committed back so that
      # Pages "Deploy from a branch" could serve it — the only route available
      # while this repository was private. It is public as of 2026-09-07, so
      # Pages builds from Actions and the artifact goes straight to the deploy.
      # (commit-back removed 2026-09-07)
      # THE WHOLE SITE IS THE ARTIFACT, not just docs/.
      #
      # Branch-serving published the repository ROOT — index.html, privacy.html,
      # 404.html, assets/, the stylesheets — with docs/ as one subdirectory of
      # it. Uploading docs/ alone deploys the package documentation with no
      # landing page, and the site 404s at `/` while every file it does contain
      # is served correctly, so nothing fails loudly.
      #
      # Uploading `.` reproduces exactly what branch-serving published, and
      # carries the root CNAME with it — under Actions, Pages reads the custom
      # domain only from the artifact, so `fianchettochess.app` depends on that
      # file being inside it. (commit-back removed 2026-09-07)
      - name: Check the site root is present
        run: |
          test -s index.html
          test -s CNAME
          echo "deploying $(cat CNAME) with $(ls docs | wc -l | tr -d ' ') doc sets"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
